name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tvshows
      TMDB_API_KEY: test_key_not_needed_for_lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build lint image
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build lint

      - name: Run lint
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm lint

  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tvshows
      TMDB_API_KEY: test_mock_key
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run tests using Docker Compose
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up --build --abort-on-container-exit backend_test

      - name: Show backend_test logs if it fails
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs backend_test

  test-frontend:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tvshows
      TMDB_API_KEY: test_key_not_needed_for_frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build frontend

      - name: Start frontend service
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d frontend

      - name: Wait for frontend to be ready
        run: sleep 10

      - name: Healthcheck frontend
        run: ./frontend/healthcheck.sh http://localhost:3000

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down
