name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build lint image
        run: docker compose -f docker-compose.test.yml build lint

      - name: Run lint
        run: docker compose -f docker-compose.test.yml run --rm lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run tests using Docker Compose
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit backend_test

      - name: Show backend_test logs if it fails
        if: failure()
        run: docker compose -f docker-compose.test.yml logs backend_test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        run: docker compose -f docker-compose.test.yml build frontend

      - name: Start all services
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for services to be ready
        run: sleep 30

      - name: Healthcheck frontend
        run: ./frontend/healthcheck.sh http://localhost:3000

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version tag
        id: version
        run: |
          # Create version from commit hash
          VERSION="v$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: tv-dashboard-k8s

      - name: Authenticate with service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker gcr.io
          echo "Docker configured for GCR"

      - name: Build and push backend image
        run: |
          docker build -t gcr.io/tv-dashboard-k8s/tv-dashboard-backend:${{ steps.version.outputs.VERSION }} ./backend
          docker tag gcr.io/tv-dashboard-k8s/tv-dashboard-backend:${{ steps.version.outputs.VERSION }} gcr.io/tv-dashboard-k8s/tv-dashboard-backend:latest
          docker push gcr.io/tv-dashboard-k8s/tv-dashboard-backend:${{ steps.version.outputs.VERSION }}
          docker push gcr.io/tv-dashboard-k8s/tv-dashboard-backend:latest

      - name: Build and push frontend image
        run: |
          docker build -t gcr.io/tv-dashboard-k8s/tv-dashboard-frontend:${{ steps.version.outputs.VERSION }} ./frontend
          docker tag gcr.io/tv-dashboard-k8s/tv-dashboard-frontend:${{ steps.version.outputs.VERSION }} gcr.io/tv-dashboard-k8s/tv-dashboard-frontend:latest
          docker push gcr.io/tv-dashboard-k8s/tv-dashboard-frontend:${{ steps.version.outputs.VERSION }}
          docker push gcr.io/tv-dashboard-k8s/tv-dashboard-frontend:latest

      - name: Update dev deployment image tags
        run: |
          # Only update dev environment - prod requires manual promotion
          sed -i "s|gcr.io/tv-dashboard-k8s/tv-dashboard-backend:.*|gcr.io/tv-dashboard-k8s/tv-dashboard-backend:${{ steps.version.outputs.VERSION }}|g" k8s-gitops/overlays/dev/backend-dev-patch.yaml
          sed -i "s|gcr.io/tv-dashboard-k8s/tv-dashboard-frontend:.*|gcr.io/tv-dashboard-k8s/tv-dashboard-frontend:${{ steps.version.outputs.VERSION }}|g" k8s-gitops/base/frontend-deployment.yaml

      - name: Commit and push updated manifests
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add k8s-gitops/
          git commit -m "deploy: update image tags to ${{ steps.version.outputs.VERSION }}" || exit 0
          git push

      - name: Create GitHub release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          release_name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            Automated release ${{ steps.version.outputs.VERSION }}
            
            Changes in this release:
            - Frontend: Mock data loading improvements
            - Backend: Enhanced metrics collection
            - Monitoring: Business intelligence dashboard
          draft: false
          prerelease: false
