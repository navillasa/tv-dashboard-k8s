services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tvshows
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    environment:
      - PORT=4000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/tvshows
      - TMDB_API_KEY=${TMDB_API_KEY}
    depends_on:
      - db
    ports:
      - "4000:4000"

