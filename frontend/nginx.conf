server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets (images, CSS, JS)
  location ~* \.(jpg|jpeg|png|gif|webp|svg|css|js|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Cache-Status "HIT-STATIC";
  }

  # Special caching for poster images
  location /images/posters/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Cache-Status "HIT-POSTER";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://dev-backend-service:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
