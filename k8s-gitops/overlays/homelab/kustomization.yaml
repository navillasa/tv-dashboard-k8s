apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tv-dashboard-homelab

resources:
  - ../../base
  - ../../base/vault
  - namespace.yaml
  - external-secrets-service-account.yaml
  - external-secret-database.yaml
  - external-secret-api.yaml

namePrefix: homelab-

labels:
  - pairs:
      environment: homelab
      cluster: microk8s

patches:
  - path: postgres-homelab-patch.yaml
  - path: backend-homelab-patch.yaml
  - path: frontend-homelab-patch.yaml
  - path: ingress-homelab-patch.yaml
  - path: vault-storage-patch.yaml

images:
  - name: tv-dashboard-backend
    newName: gcr.io/tv-dashboard-k8s/tv-dashboard-backend
    newTag: latest
  - name: tv-dashboard-frontend
    newName: gcr.io/tv-dashboard-k8s/tv-dashboard-frontend
    newTag: latest