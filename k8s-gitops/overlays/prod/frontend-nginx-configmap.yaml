apiVersion: v1
kind: ConfigMap
metadata:
  name: prod-frontend-nginx-config
data:
  default.conf: |
    upstream backend {
        server prod-backend-service:4000;
    }
    
    server {
        listen 80;
        server_name localhost;
        
        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Cache static assets (images, CSS, JS)
        location ~* \.(jpg|jpeg|png|gif|webp|svg|css|js|ico)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status "HIT-STATIC";
        }

        # Special caching for poster images
        location /images/posters/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status "HIT-POSTER";
            try_files $uri =404;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
        
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
