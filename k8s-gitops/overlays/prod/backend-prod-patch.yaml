apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1  # Demo environment (would be 3+ in real prod)
  template:
    spec:
      containers:
      - name: backend
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 200m
        env:
        - name: NODE_ENV
          value: "production"
