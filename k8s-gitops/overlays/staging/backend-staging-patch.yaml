apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2  # Higher availability for staging
  template:
    spec:
      containers:
      - name: backend
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 512Mi
            cpu: 500m
        env:
        - name: NODE_ENV
          value: "staging"
