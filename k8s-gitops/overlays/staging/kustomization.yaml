apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tv-dashboard-staging

resources:
  - ../../base
  - postgres-secret.yaml
  - api-secrets.yaml

namePrefix: staging-

commonLabels:
  environment: staging

patchesStrategicMerge:
  - backend-staging-patch.yaml

images:
  - name: tv-dashboard-backend
    newTag: staging-latest
  - name: tv-dashboard-frontend
    newTag: staging-latest
