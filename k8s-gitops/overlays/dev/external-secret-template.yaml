# This will be used later when setting up External Secrets Operator
# For now, this file documents the intended secret structure

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets-external
  namespace: tv-dashboard-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
  data:
  - secretKey: tmdb-api-key
    remoteRef:
      key: tv-dashboard/api-keys
      property: tmdb-api-key
