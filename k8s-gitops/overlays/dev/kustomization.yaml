apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tv-dashboard-dev

resources:
  - ../../base
  # Note: Secrets are created manually or via External Secrets Operator
  # See README.md for setup instructions

namePrefix: dev-

commonLabels:
  environment: dev

patchesStrategicMerge:
  - postgres-dev-patch.yaml
  - backend-dev-patch.yaml

images:
  - name: tv-dashboard-backend
    newTag: v1.2
  - name: tv-dashboard-frontend
    newTag: v1.2
