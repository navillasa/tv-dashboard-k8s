apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tv-dashboard-dev

resources:
  - ../../base
  - external-secrets-service-account.yaml
  - external-secret-database.yaml  
  - external-secret-api.yaml
  # Note: Secrets now managed by External Secrets Operator + Vault

namePrefix: dev-

labels:
  - pairs:
      environment: dev

patches:
  - path: postgres-dev-patch.yaml
  - path: backend-dev-patch.yaml
  - path: ingress-cert-patch.yaml

images:
  - name: tv-dashboard-backend
    newName: gcr.io/tv-dashboard-k8s/tv-dashboard-backend
    newTag: v20250820-0f82fbe
  - name: tv-dashboard-frontend
    newName: gcr.io/tv-dashboard-k8s/tv-dashboard-frontend
    newTag: v20250820-0f82fbe
