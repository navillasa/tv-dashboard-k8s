apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tv-dashboard-dev

resources:
  - ../../base
  # Note: Secrets are created manually or via External Secrets Operator  
  # See README.md for setup instructions

namePrefix: dev-

labels:
  - pairs:
      environment: dev

patches:
  - path: postgres-dev-patch.yaml
  - path: backend-dev-patch.yaml

images:
  - name: tv-dashboard-backend
    newName: gcr.io/tv-dashboard-k8s/tv-dashboard-backend
    newTag: v1.3
  - name: tv-dashboard-frontend
    newName: gcr.io/tv-dashboard-k8s/tv-dashboard-frontend
    newTag: v1.2
