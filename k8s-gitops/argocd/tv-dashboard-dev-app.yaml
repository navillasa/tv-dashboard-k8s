apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tv-dashboard-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/navillasa/tv-dashboard-k8s.git
    targetRevision: HEAD
    path: k8s-gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: tv-dashboard-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
