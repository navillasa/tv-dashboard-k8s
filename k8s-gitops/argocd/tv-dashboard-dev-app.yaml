apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tv-dashboard-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/navillasa/tv-dashboard-k8s.git
    targetRevision: HEAD
    path: k8s-gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: tv-dashboard-dev
  syncPolicy:
    # Enable auto-sync for dev - automatic deployment on git push
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Ignore GKE Autopilot-managed resource adjustments
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/template/spec/containers/0/resources/requests/memory
    - /spec/template/spec/containers/0/resources/requests/ephemeral-storage
    - /spec/template/spec/containers/0/resources/limits/ephemeral-storage
