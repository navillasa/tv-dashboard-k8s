apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "grafana-ip"
    networking.gke.io/managed-certificates: "monitoring-ssl"
spec:
  tls:
  - hosts:
    - monitoring.navillasa.dev
    secretName: monitoring-ssl-secret
  rules:
  - host: monitoring.navillasa.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /prometheus
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
