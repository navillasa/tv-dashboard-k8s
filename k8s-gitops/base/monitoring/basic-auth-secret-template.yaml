# Template for basic auth secret - DO NOT COMMIT ACTUAL CREDENTIALS
# Create this secret manually with:
# kubectl create secret generic basic-auth -n monitoring --from-literal=auth="$(htpasswd -nb <username> <password>)"
#
# Example:
# kubectl create secret generic basic-auth -n monitoring --from-literal=auth="$(htpasswd -nb demo password)"
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: basic-auth
#   namespace: monitoring
# type: Opaque
# data:
#   auth: <base64-encoded-htpasswd-output>
